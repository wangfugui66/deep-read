# DeepRead-v2 — zero-database architecture
# Only two services: backend (FastAPI + ripgrep) and frontend (Next.js).
# All persistent state lives in host ./data/ mounted into the backend container.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    volumes:
      - ./data:/app/data               # Markdown files persist on host
      - ./backend:/app                  # Live-reload dev (bind mount)
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - fullstack   # only start with: docker compose --profile fullstack up
